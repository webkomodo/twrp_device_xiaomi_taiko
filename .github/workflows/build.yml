name: Build TWRP taiko

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch (twrp-14 wajib: kernel GKI 6.12 / Android 16)'
        default: 'twrp-14'
        required: true
        type: choice
        options: [twrp-14, twrp-12.1]

env:
  DEVICE_DIR: device/xiaomi/taiko
  KERNEL_DIR: device/xiaomi/taiko-kernel
  DEVICE_TREE: ${{ github.repository }}
  KERNEL_TREE: ${{ github.repository_owner }}/kernel_xiaomi_taiko
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
  WORKSPACE: /home/runner/twrp

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      # Runner GitHub cuma ~14GB kosong. TWRP butuh 80-100GB.
      # Hapus toolchain preinstall (/usr/local/lib/android ~9GB, dotnet, ghc, haskell)
      # + swap file + docker image. Ini trik standar build AOSP di Actions.
      - name: Free disk space (largest)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false      # butuh beberapa pkg tetap (build-essential dll)
          docker-images: true
          swap-storage: true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: devicetree
          fetch-depth: 1

      - name: Disk report after free
        run: df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git repo python3 python3-pip gperf \
            build-essential zip curl libssl-dev libncurses5 \
            libxml2-utils xsltproc ccache schedtool lz4 unzip
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python || true
          git config --global user.name  "twrp-buildbot"
          git config --global user.email "buildbot@local"
          git config --global color.ui false

      - name: Repo init + sync
        run: |
          set -euo pipefail
          sudo mkdir -p /home/runner && sudo chown runner /home/runner || true
          mkdir -p "$WORKSPACE" && cd "$WORKSPACE"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" \
                   -g default,-mips,-darwin,-notdefault
          mkdir -p .repo/local_manifests
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch \
                   --prune -j"$(nproc --all)"

      - name: Place device + kernel trees
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          rm -rf "$DEVICE_DIR" "$KERNEL_DIR"
          mkdir -p "$(dirname "$DEVICE_DIR")"
          # Device tree: dsalin dari checkout step (working tree, bukan fetch ulang)
          cp -r "$GITHUB_WORKSPACE/devicetree" "$DEVICE_DIR"
          rm -rf "$DEVICE_DIR/.git" "$DEVICE_DIR/.github" || true
          git -C "$DEVICE_DIR" init -q
          git -C "$DEVICE_DIR" add -A
          git -C "$DEVICE_DIR" -c user.name=ci -c user.email=ci@local commit -qm device-tree || true
          # Kernel tree: clone dari repo GitHub pemilik sama
          git clone --depth=1 "https://github.com/${KERNEL_TREE}.git" "$KERNEL_DIR"
          echo "--- device ---"; ls "$DEVICE_DIR"
          echo "--- kernel ---"; ls "$KERNEL_DIR"

      - name: Build
        run: |
          # JANGAN pakai 'set -u': envsetup.sh AOSP reference $TOP yang belum
          # di-set, langsung mati "TOP: unbound variable".
          set -eo pipefail
          cd "$WORKSPACE"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR="$WORKSPACE/.ccache"
          ccache -M 10G -F 0 || true
          . build/envsetup.sh
          # A14+ wajib 3 bagian: product-release-variant. A12: 2 bagian.
          if [[ "$MANIFEST_BRANCH" == twrp-12.1* ]]; then
            lunch twrp_taiko-eng
          else
            lunch twrp_taiko-trunk_staging-eng
          fi
          mka -j"$(nproc --all)" recoveryimage vendorbootimage

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          cd "$WORKSPACE"
          echo "=== df ==="; df -h /
          echo "=== device tree ==="; ls -la "$DEVICE_DIR" || echo MISSING
          echo "=== kernel tree ===";  ls -la "$KERNEL_DIR" || echo MISSING
          echo "=== kernel image ==="; file "$KERNEL_DIR/Image/Image.gz" 2>&1
          echo "=== modules count ==="; ls "$KERNEL_DIR/ramdisk"/*.ko 2>/dev/null | wc -l
          echo "=== rbcrun? ==="; ls -la out/rbcrun 2>&1; file out/rbcrun 2>&1
          echo "=== out products ==="; ls -la out/target/product/taiko/ 2>&1 | head -40
          echo "=== last error traces ==="
          find out -name '*.log' -newermt '-40 minutes' 2>/dev/null | head -10 | xargs -r tail -n 40
          exit 0

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-taiko-${{ github.run_number }}
          path: |
            /home/runner/twrp/out/target/product/taiko/recovery.img
            /home/runner/twrp/out/target/product/taiko/vendor_boot.img
            /home/runner/twrp/out/target/product/taiko/install/*.zip
          if-no-files-found: warn
          retention-days: 14
