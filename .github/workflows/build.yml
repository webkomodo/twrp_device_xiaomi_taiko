name: Build TWRP taiko

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch'
        default: 'twrp-14'
        required: true
      device_name:
        description: 'Device codename'
        default: 'taiko'
        required: true

env:
  DEVICE_TREE: ${{ github.repository }}
  KERNEL_TREE: ItzJustNett/android_device_xiaomi_taiko-kernel
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: ${{ inputs.manifest_branch || 'twrp-14' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git repo python3 python3-pip gperf \
            build-essential zip curl libssl-dev libncurses5-dev \
            libxml2-utils xsltproc ccache schedtool lz4
          git config --global user.name "twrp-buildbot"
          git config --global user.email "buildbot@local"
          git config --global color.ui false

      - name: Repo init + sync (shallow, minimal)
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -g default,-mips,-darwin,-notdefault
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/taiko.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="$DEVICE_TREE" path="device/xiaomi/taiko" remote="github" revision="${GITHUB_REF_NAME}" />
            <project name="$KERNEL_TREE" path="device/xiaomi/taiko-kernel" remote="github" revision="main" />
          </manifest>
          EOF
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc --all) --optimized-fetch --prune

      - name: Build recovery + vendor_boot
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          . build/envsetup.sh
          # A14+ wajib 3 bagian: product-release-variant
          lunch twrp_taiko-trunk_staging-eng
          mka -j$(nproc --all) recoveryimage vendorbootimage

      - name: Diagnose starlark/release failure
        if: failure()
        run: |
          cd ~/twrp
          echo "=== device tree release files ==="
          ls -la device/xiaomi/taiko/release/ || echo NO_RELEASE_DIR
          echo "=== out/ top ==="
          ls -la out/ 2>&1 | head -20
          echo "=== generated entrypoint ==="
          cat out/release_config_entrypoint.scl 2>&1 | head -30 || echo NO_ENTRYPOINT
          echo "=== manual rbcrun run (decisive test) ==="
          out/rbcrun --mode=make --allow_external_entrypoint out/release_config_entrypoint.scl > /tmp/rbc.mk 2>/tmp/rbc.err; echo "rbcrun exit=$?"
          echo "--- rbc stdout head ---"; head -20 /tmp/rbc.mk 2>&1
          echo "--- rbc stderr ---"; cat /tmp/rbc.err 2>&1 | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-taiko-${{ github.run_number }}
          path: |
            /home/runner/twrp/out/target/product/taiko/recovery.img
            /home/runner/twrp/out/target/product/taiko/vendor_boot.img
            /home/runner/twrp/out/target/product/taiko/install/*.zip
          if-no-files-found: warn
