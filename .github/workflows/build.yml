name: Build TWRP taiko

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'TWRP manifest branch (twrp-14 wajib: kernel GKI 6.12 / Android 16)'
        default: 'twrp-14'
        required: true
        type: choice
        options: [twrp-14, twrp-12.1]

env:
  DEVICE_DIR: device/xiaomi/taiko
  KERNEL_DIR: device/xiaomi/taiko-kernel
  DEVICE_TREE: ${{ github.repository }}
  KERNEL_TREE: ${{ github.repository_owner }}/kernel_xiaomi_taiko
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
  WORKSPACE: /home/runner/twrp

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      # GitHub runners ship ~14GB free; TWRP needs 80-100GB.
      # Hapus toolchain preinstall (/usr/local/lib/android ~9GB, dotnet, ghc, haskell)
      # + swap file + docker image. Ini trik standar build AOSP di Actions.
      - name: Free disk space (largest)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false      # a few packages are still needed (build-essential et al)
          docker-images: true
          swap-storage: true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: devicetree
          fetch-depth: 1

      - name: Disk report after free
        run: df -h /

      # Runner hosted cuma 15.6GB RAM dan free-disk-space di atas sudah menghapus
      # Soong bootstrap + Android.bp analysis needs >8GB; without swap the OOM
      # killer takes the runner agent down with it. Disk is >100GB, so 12GB is safe.
      - name: Add swap headroom
        run: |
          set -eo pipefail
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          free -h
          df -h /

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git repo python3 python3-pip gperf \
            build-essential zip curl libssl-dev libncurses5 \
            libxml2-utils xsltproc ccache schedtool lz4 unzip
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python || true
          git config --global user.name  "twrp-buildbot"
          git config --global user.email "buildbot@local"
          git config --global color.ui false

      - name: Repo init + sync
        run: |
          set -euo pipefail
          sudo mkdir -p /home/runner && sudo chown runner /home/runner || true
          mkdir -p "$WORKSPACE" && cd "$WORKSPACE"
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" \
                   -g default,-mips,-darwin,-notdefault
          mkdir -p .repo/local_manifests
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch \
                   --prune -j"$(nproc --all)"

      - name: Place device + kernel trees
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          rm -rf "$DEVICE_DIR" "$KERNEL_DIR"
          mkdir -p "$(dirname "$DEVICE_DIR")"
          # Device tree: copy from the checkout step, do not fetch again.
          cp -r "$GITHUB_WORKSPACE/devicetree" "$DEVICE_DIR"
          rm -rf "$DEVICE_DIR/.git" "$DEVICE_DIR/.github" || true
          git -C "$DEVICE_DIR" init -q
          git -C "$DEVICE_DIR" add -A
          git -C "$DEVICE_DIR" -c user.name=ci -c user.email=ci@local commit -qm device-tree || true
          # Kernel tree: clone from the owner's GitHub repo.
          git clone --depth=1 "https://github.com/${KERNEL_TREE}.git" "$KERNEL_DIR"
          echo "--- device ---"; ls "$DEVICE_DIR"
          echo "--- kernel ---"; ls "$KERNEL_DIR"

      - name: Vendor schema_validation.scl for A14 release config
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          # TeamWin android-14.1 build/make/core/release_config.scl imports
          # //build/bazel/utils:schema_validation.scl, which the synced AOSP
          # build/bazel@android-14.0.0_r17 does not ship. Without it rbcrun fails
          # and out_release_config_entrypoint.scl.mk is never generated.
          mkdir -p build/bazel/utils
          cp "$DEVICE_DIR/helpers/schema_validation.scl" build/bazel/utils/schema_validation.scl
          ls -la build/bazel/utils/schema_validation.scl

      - name: Provide minimal A14 platform defaults
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          # Minimal TWRP manifest omits AOSP release flag declarations.
          # Recovery packaging needs version variables, not Android framework.
          cat > build/make/core/build_id.mk <<'EOF'
          RELEASE_PLATFORM_VERSION := 14
          RELEASE_PLATFORM_VERSION_CODENAME := REL
          RELEASE_PLATFORM_VERSION_ALL_CODENAMES := REL
          RELEASE_PLATFORM_VERSION_ALL_PREVIEW_CODENAMES :=
          RELEASE_PLATFORM_VERSION_LAST_STABLE := 14
          RELEASE_PLATFORM_VERSION_KNOWN_CODENAMES := REL
          RELEASE_PLATFORM_SDK_VERSION := 34
          RELEASE_PLATFORM_SDK_EXTENSION_VERSION := 0
          RELEASE_PLATFORM_SECURITY_PATCH := 2024-01-05
          RELEASE_PLATFORM_VNDK_VERSION := 34
          EOF
          # toolchain/pgo-profiles (pdk group) is not synced; stub an empty AFDO.
          if [ ! -f toolchain/pgo-profiles/sampling/afdo_profiles.mk ]; then
            mkdir -p toolchain/pgo-profiles/sampling
            touch toolchain/pgo-profiles/sampling/afdo_profiles.mk
          fi
          # TeamWin build/soong android-14 lacks optional host-only deps
          # (soong/testing, go-starlark json/struct packages) used by these
          # host tools. Recovery does not use them.
          rm -f build/make/tools/metadata/Android.bp
          rm -f build/make/tools/rbcrun/Android.bp
          # "team" and "install_symlink" module types are newer than TeamWin's
          # Soong; these directories are Google/AOSP-only.
          rm -rf build/make/teams
          rm -f build/make/target/product/gsi/Android.bp
          # kati runs inside nsjail as user "nobody"; out/ is created by the
          # runner user, so make soong.variables writable before the build.
          mkdir -p out/soong && chmod 777 out out/soong 2>/dev/null || true
          # config.mk hard-includes vendor/twrp/config/BoardConfigTWRP.mk,
          # which also exports TW_THEME to Soong. The minimal manifest may not
          # have synced it; vendor the two files needed.
          if [ ! -f vendor/twrp/config/BoardConfigTWRP.mk ]; then
            mkdir -p vendor/twrp/config
            curl -fsSL "https://raw.githubusercontent.com/TeamWin/android_vendor_twrp/android-14/config/BoardConfigTWRP.mk" \
              -o vendor/twrp/config/BoardConfigTWRP.mk
          fi
          if [ ! -f vendor/twrp/config/BoardConfigSoong.mk ]; then
            curl -fsSL "https://raw.githubusercontent.com/TeamWin/android_vendor_twrp/android-14/config/BoardConfigSoong.mk" \
              -o vendor/twrp/config/BoardConfigSoong.mk
          fi
          if [ ! -f vendor/twrp/config/BoardConfigKernel.mk ]; then
            curl -fsSL "https://raw.githubusercontent.com/TeamWin/android_vendor_twrp/android-14/config/BoardConfigKernel.mk" \
              -o vendor/twrp/config/BoardConfigKernel.mk
          fi
          ls -la vendor/twrp/config/

      - name: Disable release-config Starlark (unused for recovery)
        run: |
          set -euo pipefail
          cd "$WORKSPACE"
          # Minimal manifest has no release flag declarations, so the Starlark
          # entrypoint cannot run. Platform values are supplied by
          # build/make/core/build_id.mk instead.
          sed -i '/$(call run-starlark,$(OUT_DIR)\/release_config_entrypoint.scl/d' build/make/core/release_config.mk
          sed -i '/$(call run-starlark,$(OUT_DIR)\/product_validation_checks_entrypoint.scl/d' build/make/core/product_validation_checks.mk
          # TeamWin android-14.1 regressed: soong_config.mk writes
          # soong.$(TARGET_PRODUCT).variables, but soong_build (and bp2build) only
          # ever read "soong.variables" (build/soong/android/config.go:72).
          # So every run silently fell back to SetDefaultConfig -> VendorVars nil
          # -> "Could not find ui.xml for TW_THEME: not set".
          sed -i 's|SOONG_VARIABLES := $(SOONG_OUT_DIR)/soong.$(TARGET_PRODUCT).variables|SOONG_VARIABLES := $(SOONG_OUT_DIR)/soong.variables|' build/make/core/soong_config.mk
          # TeamWin android-14.1 also kept add_json_str for EnableUffdGc while its
          # own dexpreopt Go struct (and AOSP 14) declares a bool -> soong_build
          # panics "cannot unmarshal string into Go struct field ... EnableUffdGc".
          sed -i 's|$(call add_json_str,  EnableUffdGc,                            $(ENABLE_UFFD_GC))|$(call add_json_bool, EnableUffdGc,                            $(filter true,$(ENABLE_UFFD_GC)))|' build/make/core/dex_preopt_config.mk
          grep -n 'SOONG_VARIABLES :=' build/make/core/soong_config.mk
          grep -n 'EnableUffdGc' build/make/core/dex_preopt_config.mk
          # TeamWin build/make android-14.1 marks FILE_NAME_TAG obsolete, but the
          # paired android-14 Soong still writes it; KATI_obsolete_var aborts on
          # read, so the declaration itself must go (AOSP 14 just sets it).
          sed -i '/KATI_obsolete_var FILE_NAME_TAG,/d' build/make/core/main.mk
          grep -c 'KATI_obsolete_var FILE_NAME_TAG' build/make/core/main.mk || echo "FILE_NAME_TAG obsolete decl removed"
          # core/Makefile:7117 auto-includes core/tasks/*.mk. TeamWin moved the
          # fontchain_lint rule there, but synced frameworks/base (android-14)
          # still defines the same stamp target -> ckati "overriding commands".
          rm -f build/make/core/tasks/fontchain_lint.mk
          ls build/make/core/tasks/fontchain_lint.mk 2>/dev/null || echo "fontchain_lint.mk removed"
          # TeamWin android-14.1 dropped merge-fc-files from core/Makefile, but
          # synced system/sepolicy (android-14) still needs
          # file_contexts.modules.tmp. Restore the AOSP 14 block.
          python3 - <<'PY'
          import re, sys
          p = 'build/make/core/Makefile'
          s = open(p).read()
          if 'merge-fc-files' not in s:
              block = (
                  "\n# Collects file_contexts files from modules to be installed\n"
                  "$(call merge-fc-files, \\\n"
                  "  $(sort $(foreach m,$(product_MODULES),$(ALL_MODULES.$(m).FILE_CONTEXTS))),\\\n"
                  "  $(call intermediates-dir-for,ETC,file_contexts.bin)/file_contexts.modules.tmp)\n\n"
              )
              s, n = re.subn(
                  r'(\nSELINUX_FC := \$\(call intermediates-dir-for,ETC,file_contexts\.bin\)/file_contexts\.bin\n)',
                  block + r'\1', s, count=1)
              if n == 0:
                  sys.exit('anchor SELINUX_FC not found in core/Makefile')
              open(p, 'w').write(s)
              print('restored merge-fc-files block in core/Makefile')
          else:
              print('merge-fc-files already present')
          PY
          grep -n "merge-fc-files" build/make/core/Makefile
          # TeamWin android-14.1 guards the init_rc install rules in
          # base_rules.mk behind LOCAL_MODULE_MAKEFILE != SOONG_ANDROID_MK,
          # assuming Soong installs them. The paired android-14 Soong only
          # registers a PackagingSpec, so the path still lands in
          # ALL_MODULES.<mod>.INSTALLED with no rule behind it. AOSP 14 is
          # unguarded; drop the guard.
          python3 - <<'PY'
          import sys
          p = 'build/make/core/base_rules.mk'
          s = open(p).read()
          old = (
              "      my_init_rc_new_pairs := $(filter-out $(ALL_INIT_RC_INSTALLED_PAIRS),$(my_init_rc_pairs))\n"
              "      ALL_INIT_RC_INSTALLED_PAIRS += $(my_init_rc_new_pairs)\n"
              "\n"
              "      ifneq ($(LOCAL_MODULE_MAKEFILE),$(SOONG_ANDROID_MK))\n"
              "        $(call copy-many-init-script-files-checked,$(my_init_rc_new_pairs))\n"
              "        $(my_all_targets) : $(my_init_rc_installed)\n"
              "        # Install init_rc together with the target\n"
              "        $(LOCAL_INSTALLED_MODULE) : | $(my_init_rc_installed)\n"
              "      endif\n"
          )
          new = (
              "      my_init_rc_new_pairs := $(filter-out $(ALL_INIT_RC_INSTALLED_PAIRS),$(my_init_rc_pairs))\n"
              "      ALL_INIT_RC_INSTALLED_PAIRS += $(my_init_rc_new_pairs)\n"
              "\n"
              "      $(call copy-many-init-script-files-checked,$(my_init_rc_new_pairs))\n"
              "      $(my_all_targets) : $(my_init_rc_installed)\n"
              "      # Install init_rc together with the target\n"
              "      $(LOCAL_INSTALLED_MODULE) : | $(my_init_rc_installed)\n"
          )
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('removed SOONG_ANDROID_MK guard around init_rc install rules')
          elif 'ifneq ($(LOCAL_MODULE_MAKEFILE),$(SOONG_ANDROID_MK))\n        $(call copy-many-init-script-files-checked' not in s:
              print('init_rc guard already absent')
          else:
              sys.exit('init_rc guard block not found verbatim in base_rules.mk')
          PY
          grep -n -B1 -A4 "copy-many-init-script-files-checked" build/make/core/base_rules.mk
          # Same defect for vintf manifest fragments; same guard, same fix.
          python3 - <<'PY'
          import sys
          p = 'build/make/core/base_rules.mk'
          s = open(p).read()
          old = (
              "      my_vintf_new_pairs := $(filter-out $(ALL_VINTF_MANIFEST_FRAGMENTS_LIST),$(my_vintf_pairs))\n"
              "      ALL_VINTF_MANIFEST_FRAGMENTS_LIST += $(my_vintf_new_pairs)\n"
              "\n"
              "      ifneq ($(LOCAL_MODULE_MAKEFILE),$(SOONG_ANDROID_MK))\n"
              "        $(call copy-many-vintf-manifest-files-checked,$(my_vintf_new_pairs))\n"
              "        $(my_all_targets) : $(my_vintf_installed)\n"
              "        # Install fragments together with the target\n"
              "        $(LOCAL_INSTALLED_MODULE) : | $(my_vintf_installed)\n"
              "     endif\n"
          )
          new = (
              "      my_vintf_new_pairs := $(filter-out $(ALL_VINTF_MANIFEST_FRAGMENTS_LIST),$(my_vintf_pairs))\n"
              "      ALL_VINTF_MANIFEST_FRAGMENTS_LIST += $(my_vintf_new_pairs)\n"
              "\n"
              "      $(call copy-many-vintf-manifest-files-checked,$(my_vintf_new_pairs))\n"
              "      $(my_all_targets) : $(my_vintf_installed)\n"
              "      # Install fragments together with the target\n"
              "      $(LOCAL_INSTALLED_MODULE) : | $(my_vintf_installed)\n"
          )
          if old in s:
              open(p, 'w').write(s.replace(old, new, 1))
              print('removed SOONG_ANDROID_MK guard around vintf fragment install rules')
          elif 'ifneq ($(LOCAL_MODULE_MAKEFILE),$(SOONG_ANDROID_MK))\n        $(call copy-many-vintf-manifest-files-checked' not in s:
              print('vintf guard already absent')
          else:
              sys.exit('vintf guard block not found verbatim in base_rules.mk')
          PY
          grep -n -B1 -A4 "copy-many-vintf-manifest-files-checked" build/make/core/base_rules.mk
          # aconfig module types don't exist in the paired android-14 Soong.
          rm -rf build/make/tools/aconfig
          # update_engine android-14.1 duplicates libbinderwrapper already in
          # TeamWin system/core android-14.
          rm -rf system/update_engine/libbinderwrapper
          # lpdumpd pulls libbrotli, whose AOSP visibility excludes
          # //system/extras/partition_tools; recovery doesn't need it.
          python3 -c "
          import re
          p='system/extras/partition_tools/Android.bp'
          s=open(p).read()
          s=re.sub('cc_binary \{\n    name: .lpdumpd.,.*?\n\}\n','',s,flags=re.S)
          s=re.sub('\n *required: \[\n *.lpdumpd.,\n *\],\n','\n',s)
          s=re.sub('\n *.lpdumpd.,\n','\n',s)
          open(p,'w').write(s)
          "
          grep -c "lpdumpd" system/extras/partition_tools/Android.bp || echo "lpdumpd removed"
          # system/update_engine is TeamWin android-14, its Android.bp still
          # declares "fuzz_config.triage_assignee" which TeamWin soong's fuzz
          # module struct doesn't know.
          sed -i '/triage_assignee/d' system/update_engine/Android.bp
          # LOCAL_SHARED_LIBRARIES must name a module Make registers as
          # SHARED_LIBRARIES. binary.mk unconditionally emits "<lib>.so.toc" as a
          # link prerequisite for every entry, so an unknown name dangles and only
          # surfaces much later as an opaque ninja "no known rule to make it".
          # resolve-shared-libs-depes runs after every Android.mk (incl. Soong's)
          # is loaded, so ALL_MODULES.<dep>.CLASS is complete there.
          python3 - <<'PY'
          import sys
          p = 'build/make/core/main.mk'
          s = open(p).read()
          if 'INVALID_SHARED_LIB_DEPS' in s:
              print('shared-lib binary check already present')
              sys.exit(0)
          anchor = (
              "  $(eval r := $(filter $($(root))/%,$(call module-installed-files,\\\n"
              "    $(deps))))\\\n"
          )
          check = (
              "  $(eval unresolved_so_deps := $(foreach d,$(deps),$(if $(filter SHARED_LIBRARIES,$(ALL_MODULES.$(d).CLASS)),,$(d))))\\\n"
              "  $(if $(unresolved_so_deps),$(eval INVALID_SHARED_LIB_DEPS += \"$(mod) -> $(unresolved_so_deps)\"))\\\n"
          )
          if anchor not in s:
              sys.exit('resolve-shared-libs-depes anchor not found in core/main.mk')
          s = s.replace(anchor, anchor + check, 1)
          tail = (
              "endif\nendif\n\n"
              "# Pass the shared libraries dependencies to prebuilt ELF file check.\n"
          )
          abort = (
              "ifneq ($(strip $(INVALID_SHARED_LIB_DEPS)),)\n"
              "$(error INVALID LOCAL_SHARED_LIBRARIES (not registered as "
              "SHARED_LIBRARIES, so no .so/.so.toc rule exists): "
              "$(INVALID_SHARED_LIB_DEPS))\n"
              "endif\n\n"
          )
          if tail not in s:
              sys.exit('post-resolve anchor not found in core/main.mk')
          s = s.replace(tail, tail + abort, 1)
          open(p, 'w').write(s)
          print('added shared-lib binary validity check to core/main.mk')
          PY
          grep -n -A5 "INVALID_SHARED_LIB_DEPS" build/make/core/main.mk

      - name: Build
        run: |
          # envsetup.sh references unset $TOP, so 'set -u' would abort the shell.
          set -eo pipefail
          cd "$WORKSPACE"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_DIR="$WORKSPACE/.ccache"
          # Soong android-14 enables Bazel mixed-build on Linux, forcing a full
          # bp2build pass plus a symlink forest that recovery does not need.
          export BUILD_BROKEN_DISABLE_BAZEL=true
          ccache -M 10G -F 0 || true
          . build/envsetup.sh
          # A14+ wajib 3 bagian: product-release-variant. A12: 2 bagian.
          if [[ "$MANIFEST_BRANCH" == twrp-12.1* ]]; then
            lunch twrp_taiko-eng
          else
            lunch twrp_taiko-trunk_staging-eng
          fi
          # Call soong_ui directly (equivalent of 'm') so the host Go unit tests
          # can be skipped. -j3 not -j4: leave one core free for the runner agent,
          # otherwise the heartbeat drops ("hosted runner lost communication").
          build/soong/soong_ui.bash --make-mode --skip-soong-tests \
            -j3 recoveryimage vendorbootimage

      - name: Diagnostics on failure
        if: failure()
        run: |
          set +e
          cd "$WORKSPACE"
          echo "=== df ==="; df -h /
          echo "=== device tree ==="; ls -la "$DEVICE_DIR" || echo MISSING
          echo "=== kernel tree ===";  ls -la "$KERNEL_DIR" || echo MISSING
          echo "=== kernel image ==="; file "$KERNEL_DIR/Image/Image.gz" 2>&1
          echo "=== modules count ==="; ls "$KERNEL_DIR/ramdisk"/*.ko 2>/dev/null | wc -l
          echo "=== vendor/twrp? ==="; ls -la vendor/twrp/config/BoardConfigTWRP.mk 2>&1 || echo MISSING
          echo "=== soong.variables TW_THEME ==="; ls -la out/soong/soong.variables out/soong/soong.twrp_taiko.variables 2>&1; grep -o 'TW_THEME[^,]*' out/soong/soong.variables 2>&1 | head -3 || echo "no soong.variables"
          echo "=== soong_config.mk SOONG_VARIABLES line ==="; grep -n 'SOONG_VARIABLES :=' build/make/core/soong_config.mk
          echo "=== BoardConfigSoong present ==="; ls -la vendor/twrp/config/ 2>&1
          echo "=== rbcrun? ==="; ls -la out/rbcrun 2>&1; file out/rbcrun 2>&1
          echo "=== out products ==="; ls -la out/target/product/taiko/ 2>&1 | head -40
          echo "=== last error traces ==="
          find out -name '*.log' -newermt '-40 minutes' 2>/dev/null | head -10 | xargs -r tail -n 40
          echo "=== INVALID LOCAL_SHARED_LIBRARIES ==="
          grep -rn "INVALID LOCAL_SHARED_LIBRARIES" out/*.log out/soong/*.log 2>/dev/null | head -5
          echo "=== soong view of the flagged .so deps ==="
          grep -rn "android.security.apc" out/soong/Android-*.mk 2>/dev/null | head -5 || echo "no apc entry in Soong Android.mk"
          grep -rn "name: \"android.security.apc" system/security/keystore2/aidl/Android.bp 2>/dev/null
          grep -rn "libtar" out/soong/Android-*.mk 2>/dev/null | head -3 || echo "libtar not a Soong module (expected: it is a Make module)"
          exit 0

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-taiko-${{ github.run_number }}
          path: |
            /home/runner/twrp/out/target/product/taiko/recovery.img
            /home/runner/twrp/out/target/product/taiko/vendor_boot.img
            /home/runner/twrp/out/target/product/taiko/install/*.zip
          if-no-files-found: warn
          retention-days: 14
